<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3DFA2" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8A6D1D" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Hexagon Background -->
  <polygon points="50,4 90,26 90,74 50,96 10,74 10,26" fill="#121214" stroke="url(#goldGrad)" stroke-width="4" filter="url(#glow)" />
  <!-- Neural H -->
  <!-- Left vertical line -->
  <line x1="36" y1="30" x2="36" y2="70" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
  <!-- Right vertical line -->
  <line x1="64" y1="30" x2="64" y2="70" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
  <!-- Crossbar -->
  <line x1="36" y1="50" x2="64" y2="50" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  <!-- Nodes -->
  <circle cx="36" cy="30" r="4" fill="#F3DFA2" />
  <circle cx="36" cy="70" r="4" fill="#D4AF37" />
  <circle cx="64" cy="30" r="4" fill="#F3DFA2" />
  <circle cx="64" cy="70" r="4" fill="#D4AF37" />
  <circle cx="50" cy="50" r="3.5" fill="#FFFFFF" />
</svg>